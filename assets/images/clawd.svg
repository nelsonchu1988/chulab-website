<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" shape-rendering="crispEdges">
  <!-- Top antenna -->
  <rect x="6" y="0" width="2" height="2" fill="#D97757"/>
  <!-- Antenna base -->
  <rect x="5" y="2" width="4" height="1" fill="#D97757"/>
  <!-- Head/body main -->
  <rect x="2" y="3" width="10" height="6" fill="#D97757"/>
  <!-- Left ear bumps -->
  <rect x="1" y="4" width="1" height="3" fill="#D97757"/>
  <!-- Right ear bumps -->
  <rect x="12" y="4" width="1" height="3" fill="#D97757"/>
  <!-- Eyes (dark) -->
  <rect x="4" y="5" width="2" height="2" fill="#1a1a1a"/>
  <rect x="8" y="5" width="2" height="2" fill="#1a1a1a"/>
  <!-- Eye highlights -->
  <rect x="5" y="5" width="1" height="1" fill="#ffffff"/>
  <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
  <!-- Legs/tentacles (4 of them, like an octopus) -->
  <rect x="2" y="9" width="2" height="3" fill="#D97757"/>
  <rect x="5" y="9" width="2" height="2" fill="#D97757"/>
  <rect x="7" y="9" width="2" height="2" fill="#D97757"/>
  <rect x="10" y="9" width="2" height="3" fill="#D97757"/>
  <!-- Outer leg tips -->
  <rect x="1" y="11" width="1" height="1" fill="#D97757"/>
  <rect x="12" y="11" width="1" height="1" fill="#D97757"/>
</svg>
